name: Bluerock Security
description: >-
  BlueRock Security is a runtime security, observability, and governance
  platform for AI agents and Model Context Protocol (MCP) servers. Its BRACE
  (BlueRock Agent Control Environment) provides deep observability and
  context-powered guardrails across the full agentic action path — from model
  decision through agent actions, tool calls, and MCP server interactions — with
  a Trust Context Engine and an MCP Trust Registry for verifying MCP server
  ownership and capabilities. BlueRock ships a lightweight open-source Python
  runtime sensor (Apache 2.0) that captures MCP tool calls, session lifecycle,
  module imports, subprocess execution, and network calls as structured NDJSON
  with zero code changes, plus a self-hostable runtime daemon, sandbox
  isolation, policy engine, dashboard, and agent-framework integrations for
  LangChain and CrewAI. Backed by Wing Venture Capital.
