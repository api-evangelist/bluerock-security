- version: 26.23.0
  date: null
  url: https://docs.bluerock.io/release-notes/bluerock-26.23.0
  highlights:
  - Simplified BlueRock Runtime deployment; runs as the bluerockd system daemon
    with centralized config in /etc/bluerock/bluerockd.toml (Runtime, Policy,
    OTLP sections); policy blobs downloadable and verifiable with public keys.
  - Sandbox networking and security improvements — containerd-shim support for
    Docker images, Docker network binding, ingress/egress network policy
    enforcement, and expanded Seccomp policy support.
  - AI coding agent observability enabled by default with Claude, Cursor,
    Gemini, and Codex support; Bluedev VS Code extension and Cobalt for secure
    remote dev containers; Bluedev user identity management (Google Auth,
    Microsoft Entra ID SSO) and LLM cost monitoring.
